<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0b16">
<title>Bataille Navale · 2 joueurs en ligne</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(circle at 30% 0%,#0b1a2e 0%,#04080f 55%);
    color:#e6f0ff;display:flex;align-items:center;justify-content:center;
    min-height:100vh;min-height:100dvh;
    padding:16px 12px calc(16px + env(safe-area-inset-bottom));
    overscroll-behavior:none;
  }
  .app{width:100%;max-width:440px;display:flex;flex-direction:column}
  .screen{display:none;flex-direction:column;width:100%}
  .screen.active{display:flex;animation:fade .28s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  h1{font-size:1.5rem;margin:0 0 6px;text-align:center}
  .sub{text-align:center;color:#7f9bbd;font-size:.85rem;margin:0 0 18px;line-height:1.45}

  button{font:inherit;font-weight:600;border:none;border-radius:12px;cursor:pointer;
    padding:14px;width:100%;transition:transform .08s,background .15s}
  button:active{transform:scale(.975)}
  button:disabled{opacity:.45;pointer-events:none}
  .btn-primary{background:linear-gradient(135deg,#0ea5e9,#6366f1);color:#fff;
    box-shadow:0 10px 24px -8px rgba(14,165,233,.8)}
  .btn-secondary{background:#102a43;color:#cfe4ff;border:1px solid #1e3a5f}
  .btn-link{background:none;color:#7f9bbd;font-weight:500;font-size:.85rem;
    padding:10px;text-decoration:underline;text-underline-offset:3px}
  .stack{display:flex;flex-direction:column;gap:10px}

  .code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:2.4rem;
    font-weight:700;letter-spacing:.35em;text-indent:.35em;text-align:center;
    color:#7dd3fc;background:#0d1f33;border:1px solid #1e3a5f;border-radius:16px;
    padding:20px 10px;margin:6px 0 14px}
  input{font:inherit;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;width:100%;
    padding:16px;border-radius:14px;background:#0d1f33;border:1.5px solid #1e3a5f;
    color:#e6f0ff;text-align:center;font-size:1.6rem;font-weight:700;
    letter-spacing:.4em;text-indent:.4em;text-transform:uppercase;outline:none}
  input::placeholder{color:#2a4a6b;letter-spacing:.3em;text-indent:.3em}
  input:focus{border-color:#0ea5e9;box-shadow:0 0 0 4px rgba(14,165,233,.15)}
  .err{color:#fb7185;font-size:.85rem;text-align:center;min-height:1.2em;margin:8px 0 0}

  .status{text-align:center;font-size:.95rem;font-weight:600;padding:12px;
    border-radius:12px;background:#0d1f33;border:1px solid #1e3a5f;min-height:46px;
    display:flex;align-items:center;justify-content:center;margin-bottom:12px}

  .scores{display:flex;gap:8px;margin-bottom:12px}
  .score{flex:1;text-align:center;background:#0d1f33;border:1px solid #1e3a5f;
    border-radius:10px;padding:8px 4px}
  .score .label{font-size:.6rem;color:#7f9bbd;text-transform:uppercase;
    letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .score .val{font-size:1.2rem;font-weight:700;margin-top:2px}

  /* Grilles */
  .boards{display:flex;flex-direction:column;gap:10px}
  .board-wrap{background:#0a1626;border:1px solid #1e3a5f;border-radius:12px;padding:8px}
  .board-title{font-size:.7rem;color:#7f9bbd;text-transform:uppercase;
    letter-spacing:.08em;margin-bottom:6px;text-align:center}
  .board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);
    gap:2px;aspect-ratio:1/1;width:100%}
  .bcell{display:flex;align-items:center;justify-content:center;
    background:#132c47;border-radius:3px;font-size:.7rem;font-weight:700;
    color:#4b6f94;user-select:none;-webkit-user-select:none;min-height:0;transition:background .12s}
  .bcell.ship{background:#2563eb;color:#fff}
  .bcell.miss{background:#1e3a5f;color:#7f9bbd}
  .bcell.hit{background:#b91c1c;color:#fff}
  .bcell.sunk{background:#7f1d1d;color:#fca5a5}
  .bcell.clickable{cursor:pointer}
  .bcell.clickable:active{background:#1e4d7b}
  .bcell.prev{outline:2px solid #22d3ee;outline-offset:-2px}

  .fleet{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;justify-content:center}
  .fleet-item{font-size:.7rem;padding:4px 8px;border-radius:6px;background:#0d1f33;
    border:1px solid #1e3a5f;color:#7f9bbd}
  .fleet-item.placed{background:#1e3a5f;color:#7dd3fc;border-color:#0ea5e9}

  .actions{display:flex;gap:8px;margin-top:12px}
  .actions button{flex:1}
</style>
</head>
<body>
<div class="app">

  <!-- MENU -->
  <section id="screen-menu" class="screen active">
    <h1>Bataille Navale</h1>
    <p class="sub">2 joueurs · 2 téléphones · 0 installation</p>
    <div class="stack">
      <button class="btn-primary" id="btn-create">Créer une partie</button>
      <button class="btn-secondary" id="btn-join-open">Rejoindre une partie</button>
    </div>
  </section>

  <!-- REJOINDRE -->
  <section id="screen-join" class="screen">
    <h1>Rejoindre</h1>
    <p class="sub">Entre le code affiché sur l'autre téléphone</p>
    <input id="code-input" maxlength="4" placeholder="ABCD"
           autocapitalize="characters" autocomplete="off" spellcheck="false">
    <p class="err" id="join-err"></p>
    <div class="stack">
      <button class="btn-primary" id="btn-join">Rejoindre</button>
      <button class="btn-link" id="btn-join-back">Retour</button>
    </div>
  </section>

  <!-- ATTENTE -->
  <section id="screen-wait" class="screen">
    <h1 id="wait-title">Code de la partie</h1>
    <p class="sub" id="wait-sub">Donne ce code à ton adversaire</p>
    <div class="code" id="room-code">····</div>
    <p class="sub" id="wait-status">Connexion au serveur…</p>
    <button class="btn-link" id="btn-wait-cancel">Annuler</button>
  </section>

  <!-- JEU -->
  <section id="screen-game" class="screen">
    <div class="scores">
      <div class="score"><div class="label">Toi</div><div class="val" id="score-me">0</div></div>
      <div class="score"><div class="label">Adversaire</div><div class="val" id="score-them">0</div></div>
    </div>
    <div class="status" id="status">Synchronisation…</div>

    <div class="boards">
      <div class="board-wrap">
        <div class="board-title" id="title-own">Ta grille</div>
        <div class="board" id="board-own"></div>
      </div>
      <div class="board-wrap">
        <div class="board-title" id="title-enemy">Grille adverse</div>
        <div class="board" id="board-enemy"></div>
      </div>
    </div>

    <div class="fleet" id="fleet"></div>

    <div class="actions">
      <button class="btn-secondary" id="btn-rotate">Tourner</button>
      <button class="btn-primary" id="btn-ready" disabled>Prêt</button>
    </div>
    <div class="stack" style="margin-top:8px">
      <button class="btn-link" id="btn-restart">Nouvelle manche</button>
      <button class="btn-link" id="btn-quit">Quitter</button>
    </div>
  </section>

</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
(function () {
  'use strict';

  const PEER_PREFIX = 'bataillenavale-';
  const ICE = {
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:global.stun.twilio.com:3478' },
      { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
      { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
      { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }
    ]
  };
  const LETTERS = 'abcdefghjkmnpqrstuvwxyz23456789';
  const SIZE = 8;
  const FLEET = [
    { name: 'Porte-avions', size: 5 },
    { name: 'Croiseur', size: 4 },
    { name: 'Contre-torpilleur', size: 3 },
    { name: 'Sous-marin', size: 3 },
    { name: 'Torpilleur', size: 2 }
  ];

  const $ = id => document.getElementById(id);
  const screens = {
    menu: $('screen-menu'), join: $('screen-join'),
    wait: $('screen-wait'), game: $('screen-game')
  };
  function show(name) {
    for (const k in screens) screens[k].classList.toggle('active', k === name);
  }

  // Grilles : création des 64 cellules
  const ownGrid = $('board-own'), enemyGrid = $('board-enemy');
  const ownCells = [], enemyCells = [];
  for (let i = 0; i < 64; i++) {
    const c1 = document.createElement('div'); c1.className = 'bcell'; c1.dataset.i = i;
    ownGrid.appendChild(c1); ownCells.push(c1);
    const c2 = document.createElement('div'); c2.className = 'bcell'; c2.dataset.i = i;
    enemyGrid.appendChild(c2); enemyCells.push(c2);
  }

  // État global
  let peer = null, conn = null;
  let myRole = null;        // 'host' | 'guest'
  let state = null;
  let placement = null;     // { ships: [], currentIdx, direction }
  let opponentLeft = false;

  // ---------- État de la partie ----------
  function freshState() {
    return {
      phase: 'placement',        // 'placement' | 'battle' | 'over'
      turn: 'host',              // qui tire : 'host' ou 'guest'
      hostReady: false,
      guestReady: false,
      hostShips: null,           // { [index]: true }
      guestShips: null,
      hostShots: {},             // { index: 'hit'|'miss' } tirs du host sur guest
      guestShots: {},            // tirs du guest sur host
      winner: null,
      scores: { host: 0, guest: 0 }
    };
  }

  function newPlacement() {
    return { ships: [], currentIdx: 0, direction: 'h' };
  }

  // ---------- Placement ----------
  function canPlace(ships, startIdx, size, dir) {
    const r = Math.floor(startIdx / SIZE), c = startIdx % SIZE;
    if (dir === 'h' && c + size > SIZE) return false;
    if (dir === 'v' && r + size > SIZE) return false;
    const occupied = new Set();
    for (const s of ships) for (const i of s.cells) occupied.add(i);
    for (let k = 0; k < size; k++) {
      const idx = dir === 'h' ? startIdx + k : startIdx + k * SIZE;
      if (occupied.has(idx)) return false;
    }
    return true;
  }

  function placeCurrentShip(startIdx) {
    if (!placement) return;
    const shipDef = FLEET[placement.currentIdx];
    if (!shipDef) return;
    if (!canPlace(placement.ships, startIdx, shipDef.size, placement.direction)) return;

    const cells = [];
    for (let k = 0; k < shipDef.size; k++) {
      cells.push(placement.direction === 'h' ? startIdx + k : startIdx + k * SIZE);
    }
    placement.ships.push({ name: shipDef.name, size: shipDef.size, cells });
    placement.currentIdx++;
    if (placement.currentIdx >= FLEET.length) {
      $('btn-ready').disabled = false;
    }
    renderPlacement();
  }

  function removeLastShip() {
    if (!placement || placement.ships.length === 0) return;
    placement.ships.pop();
    placement.currentIdx--;
    $('btn-ready').disabled = true;
    renderPlacement();
  }

  function shipsToMap(ships) {
    const m = {};
    for (const s of ships) for (const c of s.cells) m[c] = true;
    return m;
  }

  // ---------- Rendu ----------
  function render() {
    if (!state) return;

    const myShots = myRole === 'host' ? state.hostShots : state.guestShots;
    const enemyShots = myRole === 'host' ? state.guestShots : state.hostShots;
    const myShips = myRole === 'host' ? state.hostShips : state.guestShips;
    const enemyShips = myRole === 'host' ? state.guestShips : state.hostShips;

    // Grille perso : on voit ses bateaux + les tirs reçus
    for (let i = 0; i < 64; i++) {
      const c = ownCells[i];
      c.className = 'bcell';
      if (myShips && myShips[i]) c.classList.add('ship');
      if (enemyShots[i]) {
        c.classList.remove('ship');
        c.classList.add(enemyShots[i] === 'hit' ? 'hit' : 'miss');
      }
    }

    // Grille adverse : on ne voit que les tirs envoyés
    for (let i = 0; i < 64; i++) {
      const c = enemyCells[i];
      c.className = 'bcell';
      if (myShots[i]) c.classList.add(myShots[i] === 'hit' ? 'hit' : 'miss');
      if (state.phase === 'battle' && state.turn === myRole && !myShots[i]) {
        c.classList.add('clickable');
      }
      if (state.phase === 'over' && enemyShips && enemyShips[i]) c.classList.add('sunk');
    }

    // Statut
    const statusEl = $('status');
    if (opponentLeft) statusEl.textContent = 'Adversaire déconnecté 😕';
    else if (state.phase === 'placement') {
      const myReady = myRole === 'host' ? state.hostReady : state.guestReady;
      statusEl.textContent = myReady ? "En attente de l'adversaire…" : 'Place tes bateaux';
    } else if (state.phase === 'battle') {
      statusEl.textContent = state.turn === myRole ? 'À toi de tirer !' : "Au tour de l'adversaire…";
    } else if (state.phase === 'over') {
      statusEl.textContent = state.winner === myRole ? 'Tu as gagné ! 🎉' : 'Tu as perdu 😅';
    }

    // Scores
    $('score-me').textContent = state.scores[myRole] || 0;
    $('score-them').textContent = state.scores[myRole === 'host' ? 'guest' : 'host'] || 0;

    // Flotte
    renderFleet();

    // Titres
    $('title-own').textContent = 'Ta grille';
    $('title-enemy').textContent = 'Grille adverse';
  }

  function renderPlacement() {
    if (!placement) return;

    // Effacer tous les bateaux affichés
    for (let i = 0; i < 64; i++) ownCells[i].classList.remove('ship');

    // Afficher les bateaux placés
    for (const s of placement.ships) {
      for (const c of s.cells) ownCells[c].classList.add('ship');
    }
  }

  function renderFleet() {
    const el = $('fleet');
    el.innerHTML = '';
    const placedCount = placement ? placement.ships.length : 0;
    FLEET.forEach((f, idx) => {
      const d = document.createElement('div');
      d.className = 'fleet-item' + (idx < placedCount ? ' placed' : '');
      d.textContent = f.name + ' (' + f.size + ')';
      el.appendChild(d);
    });
  }

  // ---------- Placement : interaction ----------
  ownGrid.addEventListener('click', function (e) {
    if (!placement || placement.currentIdx >= FLEET.length) return;
    const cell = e.target.closest('.bcell');
    if (!cell) return;
    placeCurrentShip(Number(cell.dataset.i));
  });

  $('btn-rotate').addEventListener('click', function () {
    if (!placement) return;
    placement.direction = placement.direction === 'h' ? 'v' : 'h';
    $('btn-rotate').textContent = placement.direction === 'h' ? 'Tourner' : 'Tourner';
    if (navigator.vibrate) navigator.vibrate(6);
  });

  $('btn-ready').addEventListener('click', function () {
    if (myRole === 'host') {
      state.hostShips = shipsToMap(placement.ships);
      state.hostReady = true;
      if (state.guestReady) state.phase = 'battle';
    } else {
      state.guestShips = shipsToMap(placement.ships);
      state.guestReady = true;
      if (state.hostReady) state.phase = 'battle';
    }
    if (state.phase === 'battle') state.turn = 'host';
    send({ type: 'state', state: state });
    $('btn-ready').disabled = true;
    render();
  });

  // ---------- Tirs ----------
  enemyGrid.addEventListener('click', function (e) {
    if (state.phase !== 'battle' || state.turn !== myRole) return;
    const cell = e.target.closest('.bcell');
    if (!cell) return;
    const i = Number(cell.dataset.i);
    const myShots = myRole === 'host' ? state.hostShots : state.guestShots;
    if (myShots[i]) return;

    if (myRole === 'host') {
      const hit = state.guestShips && state.guestShips[i];
      state.hostShots[i] = hit ? 'hit' : 'miss';
      if (hit && isFleetDestroyed(state.guestShips, state.hostShots)) {
        state.phase = 'over'; state.winner = 'host'; state.scores.host++;
      } else state.turn = 'guest';
    } else {
      send({ type: 'fire', index: i });
      return;
    }
    send({ type: 'state', state: state });
    render();
  });

  function isFleetDestroyed(shipMap, shots) {
    if (!shipMap) return false;
    for (const k in shipMap) if (!shots[k]) return false;
    return true;
  }

  // ---------- Messagerie ----------
  function send(msg) {
    if (conn && conn.open) {
      try { conn.send(msg); } catch (e) { console.warn(e); }
    }
  }

  function onData(msg) {
    if (!msg || typeof msg !== 'object') return;

    if (myRole === 'host') {
      if (msg.type === 'hello') send({ type: 'state', state: state });
      else if (msg.type === 'ready') {
        state.guestShips = msg.ships;
        state.guestReady = true;
        if (state.hostReady) { state.phase = 'battle'; state.turn = 'host'; }
        send({ type: 'state', state: state });
        render();
      } else if (msg.type === 'fire') {
        if (state.phase !== 'battle' || state.turn !== 'guest') return;
        const i = msg.index;
        if (state.guestShots[i]) return;
        const hit = state.hostShips && state.hostShips[i];
        state.guestShots[i] = hit ? 'hit' : 'miss';
        if (hit && isFleetDestroyed(state.hostShips, state.guestShots)) {
          state.phase = 'over'; state.winner = 'guest'; state.scores.guest++;
        } else state.turn = 'host';
        send({ type: 'state', state: state });
        render();
      } else if (msg.type === 'restart') {
        const scores = state.scores;
        state = freshState();
        state.scores = scores;
        placement = newPlacement();
        $('btn-ready').disabled = true;
        opponentLeft = false;
        send({ type: 'state', state: state });
        render();
        renderPlacement();
      }
    } else {
      if (msg.type === 'state' && msg.state) {
        state = msg.state;
        render();
        if (state.phase === 'placement') {
          if (!placement) placement = newPlacement();
          renderPlacement();
        }
      }
    }
  }

  // ---------- Connexion ----------
  function onPeerGone() {
    conn = null; opponentLeft = true; render();
  }

  function onIncoming(c) {
    if (conn && conn.open) { try { c.close(); } catch (e) {} return; }
    conn = c;
    conn.on('open', function () {
      myRole = 'host';
      state = freshState();
      placement = newPlacement();
      opponentLeft = false;
      $('btn-ready').disabled = true;
      show('game');
      render(); renderPlacement();
      send({ type: 'state', state: state });
    });
    conn.on('data', onData);
    conn.on('close', onPeerGone);
    conn.on('error', function (e) { console.warn(e); });
  }

  function createRoom() {
    show('wait');
    $('wait-title').textContent = 'Code de la partie';
    $('wait-sub').textContent = "Donne ce code à ton adversaire";
    $('room-code').textContent = '····';
    $('wait-status').textContent = 'Connexion au serveur…';

    let attempt = 0;
    (function tryCreate() {
      attempt++;
      if (attempt > 6) { $('wait-status').textContent = 'Connexion impossible.'; return; }
      const code = randomCode();
      const p = new Peer(PEER_PREFIX + code, { debug: 0, config: ICE });
      let opened = false, dead = false;
      p.on('open', function () {
        if (dead) return;
        opened = true; peer = p;
        $('room-code').textContent = code.toUpperCase();
        $('wait-status').textContent = "En attente de l'adversaire…";
        p.on('connection', onIncoming);
      });
      p.on('error', function (err) {
        if (opened || dead) { console.warn('Peer error:', err); return; }
        dead = true;
        try { p.destroy(); } catch (e) {}
        setTimeout(tryCreate, 400);
      });
      setTimeout(function () {
        if (!opened && !dead) { dead = true; $('wait-status').textContent = 'Serveur muet.'; }
      }, 12000);
    })();
  }

  function joinRoom(rawCode) {
    const code = String(rawCode || '').trim().toLowerCase();
    if (code.length !== 4) { $('join-err').textContent = 'Le code fait 4 caractères.'; return; }
    $('join-err').textContent = '';
    show('wait');
    $('wait-title').textContent = 'Connexion';
    $('wait-sub').textContent = 'Recherche de la partie…';
    $('room-code').textContent = code.toUpperCase();
    $('wait-status').textContent = 'Établissement du lien…';

    peer = new Peer({ debug: 0, config: ICE });
    let done = false;

    peer.on('open', function () {
      conn = peer.connect(PEER_PREFIX + code, { reliable: true });
      conn.on('open', function () {
        done = true;
        myRole = 'guest';
        state = freshState();
        placement = newPlacement();
        opponentLeft = false;
        $('btn-ready').disabled = true;
        show('game');
        render(); renderPlacement();
        send({ type: 'hello' });
      });
      conn.on('data', onData);
      conn.on('close', onPeerGone);
      conn.on('error', function (e) { console.warn(e); });
      setTimeout(function () {
        if (!done) $('wait-status').textContent = "Connexion impossible.";
      }, 15000);
    });

    peer.on('error', function (err) {
      if (err.type === 'peer-unavailable') $('wait-status').textContent = 'Aucune partie avec ce code.';
      else if (err.type === 'network' || err.type === 'server-error') $('wait-status').textContent = 'Serveur injoignable.';
    });
  }

  function randomCode() {
    let s = '';
    for (let i = 0; i < 4; i++) s += LETTERS[Math.floor(Math.random() * LETTERS.length)];
    return s;
  }

  function resetAll() {
    try { if (conn) conn.close(); } catch (e) {}
    try { if (peer) peer.destroy(); } catch (e) {}
    conn = null; peer = null; myRole = null; state = null; placement = null; opponentLeft = false;
  }

  // ---------- Boutons ----------
  $('btn-create').addEventListener('click', function () { resetAll(); createRoom(); });
  $('btn-join-open').addEventListener('click', function () {
    resetAll(); $('code-input').value = ''; $('join-err').textContent = ''; show('join');
    setTimeout(function () { $('code-input').focus(); }, 150);
  });
  $('btn-join-back').addEventListener('click', function () { show('menu'); });
  $('btn-join').addEventListener('click', function () { joinRoom($('code-input').value); });

  const codeInput = $('code-input');
  codeInput.addEventListener('input', function (e) {
    e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4);
  });
  codeInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); joinRoom(codeInput.value); }
  });

  $('btn-wait-cancel').addEventListener('click', function () { resetAll(); show('menu'); });
  $('btn-restart').addEventListener('click', function () {
    if (myRole === 'host') {
      const scores = state.scores;
      state = freshState();
      state.scores = scores;
      placement = newPlacement();
      $('btn-ready').disabled = true;
      opponentLeft = false;
      send({ type: 'state', state: state });
      render(); renderPlacement();
    } else {
      send({ type: 'restart' });
    }
  });
  $('btn-quit').addEventListener('click', function () { resetAll(); show('menu'); });
  window.addEventListener('beforeunload', function () { try { if (conn) conn.close(); } catch (e) {} });

  // Empêche le double-tap zoom sur mobile
  document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });
})();
</script>
</body>
</html>

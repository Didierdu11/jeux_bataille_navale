<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0b16">
<title>Bataille Navale · 2 joueurs en ligne</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(circle at 30% 0%,#0b1a2e 0%,#04080f 55%);
    color:#e6f0ff;display:flex;align-items:flex-start;justify-content:center;
    min-height:100vh;min-height:100dvh;
    overscroll-behavior:none;
  }
  .app{
    width:100%;max-width:480px;
    height:100vh;height:100dvh;
    display:flex;flex-direction:column;
    padding-top:env(safe-area-inset-top);
  }
  .screen{display:none;flex-direction:column;width:100%;height:100%;overflow:hidden}
  .screen.active{display:flex;animation:fade .28s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .menu-content{padding:40px 20px;overflow-y:auto;flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px}
  h1{font-size:1.5rem;margin:0;text-align:center}
  .sub{text-align:center;color:#7f9bbd;font-size:.85rem;margin:0;line-height:1.45}
  .stack{display:flex;flex-direction:column;gap:12px;width:100%;max-width:320px}

  button{font:inherit;font-weight:600;border:none;border-radius:12px;cursor:pointer;
    padding:14px;width:100%;transition:transform .08s,background .15s}
  button:active{transform:scale(.975)}
  button:disabled{opacity:.45;pointer-events:none}
  .btn-primary{background:linear-gradient(135deg,#0ea5e9,#6366f1);color:#fff;box-shadow:0 10px 24px -8px rgba(14,165,233,.8)}
  .btn-secondary{background:#102a43;color:#cfe4ff;border:1px solid #1e3a5f}
  .btn-link{background:none;color:#7f9bbd;font-weight:500;font-size:.85rem;padding:10px;text-decoration:underline;text-underline-offset:3px}

  .code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:2.4rem;
    font-weight:700;letter-spacing:.35em;text-indent:.35em;text-align:center;
    color:#7dd3fc;background:#0d1f33;border:1px solid #1e3a5f;border-radius:16px;
    padding:20px 10px;margin:6px 0 14px;width:100%;max-width:320px}
  input{font:inherit;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;width:100%;max-width:320px;
    padding:16px;border-radius:14px;background:#0d1f33;border:1.5px solid #1e3a5f;
    color:#e6f0ff;text-align:center;font-size:1.6rem;font-weight:700;
    letter-spacing:.4em;text-indent:.4em;text-transform:uppercase;outline:none}
  input::placeholder{color:#2a4a6b;letter-spacing:.3em;text-indent:.3em}
  input:focus{border-color:#0ea5e9;box-shadow:0 0 0 4px rgba(14,165,233,.15)}
  .err{color:#fb7185;font-size:.85rem;text-align:center;min-height:1.2em;margin:8px 0 0}

  #screen-game{padding:0}
  .topbar{
    flex-shrink:0;padding:8px 12px;
    background:#04080f;border-bottom:1px solid #1e3a5f;
  }
  .scores{display:flex;gap:8px;margin-bottom:6px}
  .score{flex:1;text-align:center;background:#0d1f33;border:1px solid #1e3a5f;border-radius:8px;padding:4px}
  .score .label{font-size:.55rem;color:#7f9bbd;text-transform:uppercase;letter-spacing:.08em}
  .score .val{font-size:1.1rem;font-weight:700}
  .status{text-align:center;font-size:.85rem;font-weight:600;padding:8px;border-radius:8px;
    background:#0d1f33;border:1px solid #1e3a5f;min-height:36px;
    display:flex;align-items:center;justify-content:center}

  .game-scroll{
    flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:12px 12px 120px 12px;
    overscroll-behavior:contain;
  }

  .boards{display:flex;flex-direction:column;gap:10px}
  .board-wrap{background:#0a1626;border:1px solid #1e3a5f;border-radius:12px;padding:8px}
  .board-title{font-size:.7rem;color:#7f9bbd;text-transform:uppercase;
    letter-spacing:.08em;margin-bottom:6px;text-align:center;font-weight:600}
  .board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);
    gap:2px;aspect-ratio:1/1;width:100%}
  .bcell{display:flex;align-items:center;justify-content:center;
    background:#132c47;border-radius:3px;font-size:.7rem;font-weight:700;
    color:#4b6f94;user-select:none;-webkit-user-select:none;min-height:0;transition:background .12s}
  .bcell.ship{background:#2563eb;color:#fff}
  .bcell.preview{background:#22d3ee;opacity:.7}
  .bcell.invalid{background:#7f1d1d;opacity:.7}
  .bcell.miss{background:#1e3a5f;color:#7f9bbd}
  .bcell.hit{background:#b91c1c;color:#fff}
  .bcell.sunk{background:#7f1d1d;color:#fca5a5}
  .bcell.clickable{cursor:pointer}
  .bcell.clickable:active{background:#1e4d7b}

  .fleet{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;justify-content:center}
  .fleet-item{font-size:.65rem;padding:3px 7px;border-radius:6px;background:#0d1f33;
    border:1px solid #1e3a5f;color:#7f9bbd;cursor:pointer;
    transition:background .15s,border-color .15s,transform .08s}
  .fleet-item:active{transform:scale(.95)}
  .fleet-item.placed{background:#1e3a5f;color:#7dd3fc;border-color:#0ea5e9}
  .fleet-item.selected{background:#1e4d7b;color:#7dd3fc;border-color:#22d3ee;box-shadow:0 0 0 2px #22d3ee}
  .fleet-item.selected::after{content:" ✓"}

  .bottom-bar{
    position:fixed;bottom:0;left:0;right:0;
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    background:#04080f;border-top:1px solid #1e3a5f;
    display:flex;flex-direction:column;gap:6px;
    max-width:480px;margin:0 auto;z-index:10;
  }
  .actions{display:flex;gap:8px}
  .actions button{flex:1;padding:12px}
</style>
</head>
<body>
<div class="app">

  <section id="screen-menu" class="screen active">
    <div class="menu-content">
      <h1>Bataille Navale</h1>
      <p class="sub">2 joueurs · 2 téléphones · 0 installation</p>
      <div class="stack">
        <button class="btn-primary" id="btn-create" type="button">Créer une partie</button>
        <button class="btn-secondary" id="btn-join-open" type="button">Rejoindre une partie</button>
      </div>
    </div>
  </section>

  <section id="screen-join" class="screen">
    <div class="menu-content">
      <h1>Rejoindre</h1>
      <p class="sub">Entre le code affiché sur l'autre téléphone</p>
      <input id="code-input" maxlength="4" placeholder="ABCD"
             autocapitalize="characters" autocomplete="off" spellcheck="false">
      <p class="err" id="join-err"></p>
      <div class="stack">
        <button class="btn-primary" id="btn-join" type="button">Rejoindre</button>
        <button class="btn-link" id="btn-join-back" type="button">Retour</button>
      </div>
    </div>
  </section>

  <section id="screen-wait" class="screen">
    <div class="menu-content">
      <h1 id="wait-title">Code de la partie</h1>
      <p class="sub" id="wait-sub">Donne ce code à ton adversaire</p>
      <div class="code" id="room-code">····</div>
      <p class="sub" id="wait-status">Connexion au serveur…</p>
      <button class="btn-link" id="btn-wait-cancel" type="button">Annuler</button>
    </div>
  </section>

  <section id="screen-game" class="screen">
    <div class="topbar">
      <div class="scores">
        <div class="score"><div class="label">Toi</div><div class="val" id="score-me">0</div></div>
        <div class="score"><div class="label">Adversaire</div><div class="val" id="score-them">0</div></div>
      </div>
      <div class="status" id="status">Synchronisation…</div>
    </div>

    <div class="game-scroll">
      <div class="boards">
        <div class="board-wrap">
          <div class="board-title" id="title-own">Ta grille</div>
          <div class="board" id="board-own"></div>
        </div>
        <div class="board-wrap">
          <div class="board-title" id="title-enemy">Grille adverse</div>
          <div class="board" id="board-enemy"></div>
        </div>
      </div>
      <div class="fleet" id="fleet"></div>
    </div>

    <div class="bottom-bar">
      <div class="actions">
        <button class="btn-secondary" id="btn-rotate" type="button">→ Horiz.</button>
        <button class="btn-primary" id="btn-ready" type="button" disabled>Prêt</button>
      </div>
      <div class="actions">
        <button class="btn-link" id="btn-restart" type="button">Nouvelle manche</button>
        <button class="btn-link" id="btn-quit" type="button">Quitter</button>
      </div>
    </div>
  </section>

</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
(function () {
  'use strict';

  const PEER_PREFIX = 'bataillenavale-';
  const ICE = {
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:global.stun.twilio.com:3478' },
      { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
      { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
      { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }
    ]
  };
  const LETTERS = 'abcdefghjkmnpqrstuvwxyz23456789';
  const SIZE = 8;
  const FLEET = [
    { name: 'Porte-avions', size: 5 },
    { name: 'Croiseur', size: 4 },
    { name: 'Contre-torpilleur', size: 3 },
    { name: 'Sous-marin', size: 3 },
    { name: 'Torpilleur', size: 2 }
  ];

  const $ = id => document.getElementById(id);

  let peer = null;
  let conn = null;
  let myRole = null;
  let state = null;
  let placement = null;
  let opponentLeft = false;
  let previewIndex = -1;

  const screens = {
    menu: $('screen-menu'),
    join: $('screen-join'),
    wait: $('screen-wait'),
    game: $('screen-game')
  };

  function showScreen(name) {
    for (const k in screens) {
      if (screens[k]) screens[k].classList.toggle('active', k === name);
    }
  }

  const ownGrid = $('board-own');
  const enemyGrid = $('board-enemy');
  const ownCells = [];
  const enemyCells = [];

  for (let i = 0; i < SIZE * SIZE; i++) {
    const c1 = document.createElement('div');
    c1.className = 'bcell';
    c1.dataset.i = String(i);
    ownGrid.appendChild(c1);
    ownCells.push(c1);

    const c2 = document.createElement('div');
    c2.className = 'bcell';
    c2.dataset.i = String(i);
    enemyGrid.appendChild(c2);
    enemyCells.push(c2);
  }

  function freshState() {
    return {
      phase: 'placement',
      turn: 'host',
      hostReady: false,
      guestReady: false,
      hostShips: null,
      guestShips: null,
      hostShots: {},
      guestShots: {},
      winner: null,
      scores: { host: 0, guest: 0 }
    };
  }

  function newPlacement() {
    return { ships: [], currentIdx: 0, direction: 'h', selected: 0 };
  }

  function canPlace(ships, startIdx, size, dir) {
    const r = Math.floor(startIdx / SIZE);
    const c = startIdx % SIZE;
    if (dir === 'h' && c + size > SIZE) return false;
    if (dir === 'v' && r + size > SIZE) return false;
    const occupied = new Set();
    for (const s of ships) for (const idx of s.cells) occupied.add(idx);
    for (let k = 0; k < size; k++) {
      const idx = dir === 'h' ? startIdx + k : startIdx + k * SIZE;
      if (occupied.has(idx)) return false;
    }
    return true;
  }

  function getShipDefByIndex(idx) {
    return FLEET[idx] || null;
  }

  function isShipPlaced(idx) {
    return placement && placement.ships.some(s => s.fleetIndex === idx);
  }

  function placeSelectedShip(startIdx) {
    if (!placement) return;
    const idx = placement.selected;
    const shipDef = getShipDefByIndex(idx);
    if (!shipDef) return;
    if (isShipPlaced(idx)) return;
    if (!canPlace(placement.ships, startIdx, shipDef.size, placement.direction)) return;

    const cells = [];
    for (let k = 0; k < shipDef.size; k++) {
      cells.push(placement.direction === 'h' ? startIdx + k : startIdx + k * SIZE);
    }
    placement.ships.push({
      name: shipDef.name,
      size: shipDef.size,
      fleetIndex: idx,
      cells
    });

    const next = FLEET.findIndex((f, i) => !isShipPlaced(i));
    placement.selected = next >= 0 ? next : -1;

    const allPlaced = FLEET.every((f, i) => isShipPlaced(i));
    $('btn-ready').disabled = !allPlaced;

    previewIndex = -1;
    renderPlacement();
    renderFleet();
  }

  function shipsToMap(ships) {
    const m = {};
    for (const s of ships) for (const c of s.cells) m[c] = true;
    return m;
  }

  function render() {
    if (!state) return;

    const myShots = myRole === 'host' ? state.hostShots : state.guestShots;
    const enemyShots = myRole === 'host' ? state.guestShots : state.hostShots;
    const myShips = myRole === 'host' ? state.hostShips : state.guestShips;
    const enemyShips = myRole === 'host' ? state.guestShips : state.hostShips;

    for (let i = 0; i < SIZE * SIZE; i++) {
      const c = ownCells[i];
      c.className = 'bcell';
      if (myShips && myShips[i]) c.classList.add('ship');
      if (enemyShots[i]) {
        c.classList.remove('ship');
        c.classList.add(enemyShots[i] === 'hit' ? 'hit' : 'miss');
      }
    }

    for (let i = 0; i < SIZE * SIZE; i++) {
      const c = enemyCells[i];
      c.className = 'bcell';
      if (myShots[i]) c.classList.add(myShots[i] === 'hit' ? 'hit' : 'miss');
      if (state.phase === 'battle' && state.turn === myRole && !myShots[i]) {
        c.classList.add('clickable');
      }
      if (state.phase === 'over' && enemyShips && enemyShips[i]) c.classList.add('sunk');
    }

    const statusEl = $('status');
    if (opponentLeft) {
      statusEl.textContent = 'Adversaire déconnecté 😕';
    } else if (state.phase === 'placement') {
      const myReady = myRole === 'host' ? state.hostReady : state.guestReady;
      const otherReady = myRole === 'host' ? state.guestReady : state.hostReady;
      if (myReady && otherReady) statusEl.textContent = 'Démarrage...';
      else if (myReady) statusEl.textContent = "En attente de l'adversaire…";
      else statusEl.textContent = 'Place tes bateaux';
    } else if (state.phase === 'battle') {
      statusEl.textContent = state.turn === myRole ? 'À toi de tirer !' : "Au tour de l'adversaire…";
    } else if (state.phase === 'over') {
      statusEl.textContent = state.winner === myRole ? 'Tu as gagné ! 🎉' : 'Tu as perdu 😅';
    }

    $('score-me').textContent = state.scores[myRole] || 0;
    $('score-them').textContent = state.scores[myRole === 'host' ? 'guest' : 'host'] || 0;
    renderFleet();
  }

  function renderPlacement() {
    if (!placement) return;
    for (let i = 0; i < SIZE * SIZE; i++) {
      ownCells[i].classList.remove('ship', 'preview', 'invalid');
    }
    for (const s of placement.ships) {
      for (const c of s.cells) ownCells[c].classList.add('ship');
    }
    const selIdx = placement.selected;
    if (selIdx >= 0 && selIdx < FLEET.length && !isShipPlaced(selIdx) && previewIndex >= 0) {
      const shipDef = FLEET[selIdx];
      const ok = canPlace(placement.ships, previewIndex, shipDef.size, placement.direction);
      for (let k = 0; k < shipDef.size; k++) {
        const idx = placement.direction === 'h' ? previewIndex + k : previewIndex + k * SIZE;
        if (idx < 0 || idx >= SIZE * SIZE) continue;
        const r = Math.floor(previewIndex / SIZE);
        const c = previewIndex % SIZE;
        if (placement.direction === 'h' && c + k >= SIZE) continue;
        if (placement.direction === 'v' && r + k >= SIZE) continue;
        ownCells[idx].classList.add(ok ? 'preview' : 'invalid');
      }
    }
  }

  function renderFleet() {
    const el = $('fleet');
    el.innerHTML = '';
    FLEET.forEach((f, idx) => {
      const d = document.createElement('div');
      const placed = isShipPlaced(idx);
      d.className = 'fleet-item' + (placed ? ' placed' : '') +
                    (!placed && placement && placement.selected === idx ? ' selected' : '');
      d.textContent = f.name + ' (' + f.size + ')';
      d.dataset.idx = idx;
      d.addEventListener('click', function () {
        if (isShipPlaced(idx)) return;
        if (!placement) return;
        placement.selected = idx;
        previewIndex = -1;
        renderFleet();
        renderPlacement();
        if (navigator.vibrate) navigator.vibrate(6);
      });
      el.appendChild(d);
    });
  }

  function send(msg) {
    if (conn && conn.open) {
      try { conn.send(msg); } catch (e) { console.warn(e); }
    }
  }

  function onData(msg) {
    if (!msg || typeof msg !== 'object') return;

    if (myRole === 'host') {
      if (msg.type === 'hello') {
        send({ type: 'state', state: state });
      } else if (msg.type === 'ready') {
        state.guestShips = msg.ships;
        state.guestReady = true;
        if (state.hostReady) {
          state.phase = 'battle';
          state.turn = 'host';
        }
        send({ type: 'state', state: state });
        render();
      } else if (msg.type === 'fire') {
        if (state.phase !== 'battle' || state.turn !== 'guest') return;
        const i = msg.index;
        if (state.guestShots[i]) return;
        const hit = state.hostShips && state.hostShips[i];
        state.guestShots[i] = hit ? 'hit' : 'miss';
        if (hit && isFleetDestroyed(state.hostShips, state.guestShots)) {
          state.phase = 'over';
          state.winner = 'guest';
          state.scores.guest++;
        } else {
          state.turn = 'host';
        }
        send({ type: 'state', state: state });
        render();
      } else if (msg.type === 'restart') {
        const scores = state.scores;
        state = freshState();
        state.scores = scores;
        placement = newPlacement();
        $('btn-ready').disabled = true;
        $('btn-rotate').textContent = '→ Horiz.';
        opponentLeft = false;
        previewIndex = -1;
        send({ type: 'state', state: state });
        render();
        renderPlacement();
        renderFleet();
      }
    } else {
      if (msg.type === 'state' && msg.state) {
        state = msg.state;
        render();
        if (state.phase === 'placement') {
          if (!placement) placement = newPlacement();
          renderPlacement();
        }
      }
    }
  }

  function isFleetDestroyed(shipMap, shots) {
    if (!shipMap) return false;
    for (const k in shipMap) if (!shots[k]) return false;
    return true;
  }

  function onPeerGone() {
    conn = null;
    opponentLeft = true;
    render();
  }

  function onIncoming(c) {
    if (conn && conn.open) { try { c.close(); } catch (e) {} return; }
    conn = c;
    conn.on('open', function () {
      myRole = 'host';
      state = freshState();
      placement = newPlacement();
      placement.selected = 0;
      opponentLeft = false;
      previewIndex = -1;
      $('btn-ready').disabled = true;
      $('btn-rotate').textContent = '→ Horiz.';
      showScreen('game');
      render();
      renderPlacement();
      renderFleet();
      send({ type: 'state', state: state });
    });
    conn.on('data', onData);
    conn.on('close', onPeerGone);
    conn.on('error', function (e) { console.warn(e); });
  }

  function randomCode() {
    let s = '';
    for (let i = 0; i < 4; i++) s += LETTERS[Math.floor(Math.random() * LETTERS.length)];
    return s;
  }

  function createRoom() {
    showScreen('wait');
    $('wait-title').textContent = 'Code de la partie';
    $('wait-sub').textContent = "Donne ce code à ton adversaire";
    $('room-code').textContent = '····';
    $('wait-status').textContent = 'Connexion au serveur…';

    let attempt = 0;
    (function tryCreate() {
      attempt++;
      if (attempt > 6) {
        $('wait-status').textContent = 'Connexion impossible.';
        return;
      }
      const code = randomCode();
      let p;
      try {
        p = new Peer(PEER_PREFIX + code, { debug: 0, config: ICE });
      } catch (e) {
        $('wait-status').textContent = 'Erreur de connexion au serveur.';
        return;
      }
      let opened = false, dead = false;
      p.on('open', function () {
        if (dead) return;
        opened = true;
        peer = p;
        $('room-code').textContent = code.toUpperCase();
        $('wait-status').textContent = "En attente de l'adversaire…";
        p.on('connection', onIncoming);
      });
      p.on('error', function (err) {
        if (opened || dead) { console.warn('Peer error:', err); return; }
        dead = true;
        try { p.destroy(); } catch (e) {}
        setTimeout(tryCreate, 400);
      });
      setTimeout(function () {
        if (!opened && !dead) {
          dead = true;
          $('wait-status').textContent = 'Le serveur ne répond pas. Réessaie.';
        }
      }, 12000);
    })();
  }

  function joinRoom(rawCode) {
    const code = String(rawCode || '').trim().toLowerCase();
    if (code.length !== 4) {
      $('join-err').textContent = 'Le code fait 4 caractères.';
      return;
    }
    $('join-err').textContent = '';
    showScreen('wait');
    $('wait-title').textContent = 'Connexion';
    $('wait-sub').textContent = 'Recherche de la partie…';
    $('room-code').textContent = code.toUpperCase();
    $('wait-status').textContent = 'Établissement du lien…';

    let done = false;
    try {
      peer = new Peer({ debug: 0, config: ICE });
    } catch (e) {
      $('wait-status').textContent = 'Erreur de connexion au serveur.';
      return;
    }

    peer.on('open', function () {
      conn = peer.connect(PEER_PREFIX + code, { reliable: true });
      conn.on('open', function () {
        done = true;
        myRole = 'guest';
        state = freshState();
        placement = newPlacement();
        placement.selected = 0;
        opponentLeft = false;
        previewIndex = -1;
        $('btn-ready').disabled = true;
        $('btn-rotate').textContent = '→ Horiz.';
        showScreen('game');
        render();
        renderPlacement();
        renderFleet();
        send({ type: 'hello' });
      });
      conn.on('data', onData);
      conn.on('close', onPeerGone);
      conn.on('error', function (e) { console.warn(e); });
      setTimeout(function () {
        if (!done) $('wait-status').textContent = 'Connexion impossible.';
      }, 15000);
    });

    peer.on('error', function (err) {
      if (err.type === 'peer-unavailable') $('wait-status').textContent = 'Aucune partie avec ce code.';
      else if (err.type === 'network' || err.type === 'server-error') $('wait-status').textContent = 'Serveur injoignable.';
      else console.warn('Peer error:', err);
    });
  }

  function resetAll() {
    try { if (conn) conn.close(); } catch (e) {}
    try { if (peer) peer.destroy(); } catch (e) {}
    conn = null;
    peer = null;
    myRole = null;
    state = null;
    placement = null;
    opponentLeft = false;
    previewIndex = -1;
  }

  const btnCreate = $('btn-create');
  if (btnCreate) {
    btnCreate.addEventListener('click', function (e) {
      e.preventDefault();
      resetAll();
      createRoom();
    });
  }

  const btnJoinOpen = $('btn-join-open');
  if (btnJoinOpen) {
    btnJoinOpen.addEventListener('click', function (e) {
      e.preventDefault();
      resetAll();
      $('code-input').value = '';
      $('join-err').textContent = '';
      showScreen('join');
      setTimeout(function () { $('code-input').focus(); }, 150);
    });
  }

  const btnJoinBack = $('btn-join-back');
  if (btnJoinBack) {
    btnJoinBack.addEventListener('click', function () { showScreen('menu'); });
  }

  const btnJoin = $('btn-join');
  if (btnJoin) {
    btnJoin.addEventListener('click', function () {
      joinRoom($('code-input').value);
    });
  }

  const codeInput = $('code-input');
  if (codeInput) {
    codeInput.addEventListener('input', function (e) {
      e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4);
    });
    codeInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        joinRoom(codeInput.value);
      }
    });
  }

  const btnWaitCancel = $('btn-wait-cancel');
  if (btnWaitCancel) {
    btnWaitCancel.addEventListener('click', function () {
      resetAll();
      showScreen('menu');
    });
  }

  const btnRotate = $('btn-rotate');
  if (btnRotate) {
    btnRotate.addEventListener('click', function () {
      if (!placement) return;
      placement.direction = placement.direction === 'h' ? 'v' : 'h';
      btnRotate.textContent = placement.direction === 'h' ? '→ Horiz.' : '↓ Vert.';
      previewIndex = -1;
      renderPlacement();
      if (navigator.vibrate) navigator.vibrate(6);
    });
  }

  const btnReady = $('btn-ready');
  if (btnReady) {
    btnReady.addEventListener('click', function () {
      if (!placement) return;
      if (placement.currentIdx < FLEET.length) return;

      const shipsMap = shipsToMap(placement.ships);
      if (myRole === 'host') {
        state.hostShips = shipsMap;
        state.hostReady = true;
        if (state.guestReady) {
          state.phase = 'battle';
          state.turn = 'host';
        }
        send({ type: 'state', state: state });
      } else {
        state.guestShips = shipsMap;
        state.guestReady = true;
        send({ type: 'ready', ships: shipsMap });
      }
      btnReady.disabled = true;
      render();
    });
  }

  const btnRestart = $('btn-restart');
  if (btnRestart) {
    btnRestart.addEventListener('click', function () {
      if (!state) return;
      if (myRole === 'host') {
        const scores = state.scores;
        state = freshState();
        state.scores = scores;
        placement = newPlacement();
        placement.selected = 0;
        $('btn-ready').disabled = true;
        $('btn-rotate').textContent = '→ Horiz.';
        opponentLeft = false;
        previewIndex = -1;
        send({ type: 'state', state: state });
        render();
        renderPlacement();
        renderFleet();
      } else {
        send({ type: 'restart' });
      }
    });
  }

  const btnQuit = $('btn-quit');
  if (btnQuit) {
    btnQuit.addEventListener('click', function () {
      resetAll();
      showScreen('menu');
    });
  }

  ownGrid.addEventListener('pointermove', function (e) {
    if (!placement || placement.selected < 0) return;
    const cell = e.target.closest('.bcell');
    if (!cell) return;
    const i = Number(cell.dataset.i);
    if (i === previewIndex) return;
    previewIndex = i;
    renderPlacement();
  });

  ownGrid.addEventListener('pointerleave', function () {
    previewIndex = -1;
    renderPlacement();
  });

  ownGrid.addEventListener('click', function (e) {
    if (!placement || placement.selected < 0) return;
    const cell = e.target.closest('.bcell');
    if (!cell) return;
    placeSelectedShip(Number(cell.dataset.i));
  });

  enemyGrid.addEventListener('click', function (e) {
    if (!state || state.phase !== 'battle' || state.turn !== myRole) return;
    const cell = e.target.closest('.bcell');
    if (!cell) return;
    const i = Number(cell.dataset.i);
    const myShots = myRole === 'host' ? state.hostShots : state.guestShots;
    if (myShots[i]) return;

    if (myRole === 'host') {
      const hit = state.guestShips && state.guestShips[i];
      state.hostShots[i] = hit ? 'hit' : 'miss';
      if (hit && isFleetDestroyed(state.guestShips, state.hostShots)) {
        state.phase = 'over';
        state.winner = 'host';
        state.scores.host++;
      } else {
        state.turn = 'guest';
      }
      send({ type: 'state', state: state });
      render();
    } else {
      send({ type: 'fire', index: i });
    }
  });

  window.addEventListener('beforeunload', function () {
    try { if (conn) conn.close(); } catch (e) {}
  });

  document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });
})();
</script>
</body>
</html>
